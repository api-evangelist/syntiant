aid: syntiant
name: Syntiant
description: Syntiant Corp is an Irvine, California edge-AI semiconductor company founded
  in 2017 that designs ultra-low-power Neural Decision Processors (NDPs) and the deep-learning
  models and tooling that run on them, bringing always-on speech, audio, sensor and
  vision inference to battery-powered devices without a cloud connection. Its silicon
  family spans the NDP100/NDP101, NDP102, NDP115, NDP120, NDP200 and NDP250, paired
  with a Training Development Kit (TDK) that maps TensorFlow models onto the NDP core
  and an embedded SDK for integration into customer firmware. In December 2024 Syntiant
  completed the USD 150 million acquisition of Knowles Corporation's Consumer MEMS
  Microphones business, taking the company from roughly 70 to nearly 1,700 employees
  and making microphones the majority of its revenue. Syntiant is a silicon, module
  and embedded-software supplier rather than an API provider - enrichment probing found
  no public web API, no OpenAPI or other machine-readable contract, no developer portal,
  no first-party package-registry SDKs and no event surface; its SDK and TDK are distributed
  to customers through a private GitLab and under agreement.
